# Validates every pull request and every push to main.
#
# Six jobs, in order of how fast they tell you something is wrong:
#
#   title   the pull request title is a conventional commit (pull requests only)
#   static  lint + typecheck, one Node, seconds
#   test    the node:test suite, on every supported Node
#   e2e     renders the Big Bank plc example end to end, on every developable
#           Node, and guards the product's core promise: `--single-file` output
#           that makes no network requests. It also runs the React Flow
#           engine's acceptance harness over every view of the acceptance set
#   consumer  the >=20 floor, via npm and production dependencies only — what
#             `npx github:FormulaMonks/renderizr` actually does
#   structurizr  Structurizr's own tools, pinned: the committed acceptance
#                fixture matches what `pnpm fixtures:acceptance` writes
#   ci      one required status check that stands for all of the above
#
# Outside `ci`, and so never required: `contact sheet`, which screenshots
# every acceptance view for people to review, on pull requests that touch the
# engine.
#
# Node matrix: two different contracts, proved two different ways.
#
# `engines.node` says ">=20" and README.md badges it, but that is a promise to
# people who *run* Renderizr — `npx github:FormulaMonks/renderizr`, which is npm
# installing the runtime dependencies and executing scripts/build.js. It is not
# a promise that the repository can be developed on Node 20, and it cannot be:
# pnpm 11 requires Node >=22.13 (it imports `node:sqlite`), so every pnpm-based
# job dies at setup on 20 before a single test runs.
#
# So the pnpm jobs — static, test, e2e — run on 22 and 24, and a separate
# `consumer` job proves the >=20 floor the way a user actually meets it: npm,
# production dependencies only, no pnpm and no dev toolchain. If that job ever
# fails, `engines.node` is a lie and the floor has to move.
#
# .nvmrc/.mise.toml pin 24 for development; that is the toolchain, not the
# supported range.
#
# Only the e2e and contact sheet jobs check out the submodule.
# `submodules/structurizr` is an upstream reference checkout; lint, typecheck,
# test and the build itself all pass without it. e2e wants it because it carries pinned, committed copies of the Big Bank plc,
# groups and Amazon Web Services workspaces
# (structurizr-export/src/test/resources/), which lets the end-to-end render
# and the acceptance set run off disk instead of reaching for the network.
# Without it, the `test` job's run of test/acceptance.test.js skips those
# three workspaces with a reason and checks Renderizr's own.
#
# `edited` is in the pull_request trigger list — which the default (opened,
# synchronize, reopened) does not include — so that editing a pull request
# title re-runs the `title` job and turns the check green without a push or a
# manual re-run. The cost is that editing a description also re-runs the whole
# matrix. That is deliberate: the alternative, skipping the heavy jobs on an
# `edited` event, is a branch-protection bypass — push failing code, edit the
# description, and the newest `ci` run reports success with everything skipped.
# Wasting a few minutes of a hosted runner is the cheaper mistake.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

# Least privilege at the top; no job here escalates.
permissions:
  contents: read

# Supersede in-flight PR runs, but let pushes to main finish — those are the
# runs whose result the badge and the release process read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Committed, pinned by the submodule gitlink, and the same workspace the
  # README tells people to try first.
  BIG_BANK: submodules/structurizr/structurizr-export/src/test/resources/big-bank-plc.json
  PNPM_VERSION: "11"

jobs:
  # Every pull request is squash-merged and the squash message is the pull
  # request title (MAINTAINERS.md → "What a maintainer does"; CONTRIBUTING.md →
  # "How a review goes"), and release-please derives the next version and the
  # CHANGELOG.md entry from exactly those messages. So the title is not a
  # nicety — it is release input, and it is the one thing in this repository
  # that nothing else validated: `.husky/commit-msg` runs commitlint on local
  # commits, but `git commit --no-verify` skips it, a fork's clone never
  # installs the hook at all, and none of those individual messages survive the
  # squash anyway. This job checks the string that actually ships.
  #
  # It runs the repository's own `commitlint.config.cjs` through the
  # `@commitlint/cli` already in devDependencies, rather than a third-party
  # title-linting action: same rules locally and in CI by construction, and no
  # fourth action to pin and keep pinned.
  pr_title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The title goes through the environment, never through the run script's
      # text — a pull request title is attacker-controlled and `${{ }}` would
      # interpolate it into the shell before bash ever sees a quote.
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          echo "Title: ${PR_TITLE}"
          if printf '%s\n' "${PR_TITLE}" | pnpm exec commitlint --verbose; then
            exit 0
          fi
          echo "::error title=Pull request title is not a conventional commit::This title becomes the squash-merge commit message and the changelog entry, so it has to parse. Use type(optional-scope): summary — e.g. 'fix(cli): reject a workspace path that is a directory'. Types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test — and nothing else. Edit the title and this check re-runs on its own; see CONTRIBUTING.md, 'Commits'."
          exit 1

  static:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  e2e:
    name: e2e (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `.gitmodules` sets `update = none` so `npx` skips the submodule, which
      # makes `submodules: true` skip it as well. `--checkout` overrides that.
      - name: Check out the structurizr submodule
        run: git submodule update --init --checkout --depth=1 submodules/structurizr

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Confirm the fixture is really on disk
        run: test -s "$BIG_BANK"

      # `pnpm render` is `tsc && node scripts/build.js` — the same command the
      # README and CONTRIBUTING document. No `--` before the arguments: pnpm
      # forwards them, and node:util parseArgs would read everything after a
      # `--` as a positional workspace.
      - name: Render Big Bank plc (multi-file)
        run: pnpm render "$BIG_BANK" --out dist-e2e

      - name: Assert the multi-file output is a site
        run: |
          test -f dist-e2e/index.html
          test -d dist-e2e/assets
          test -f dist-e2e/favicon.png
          # One entry script, one stylesheet, both emitted by the build.
          ls dist-e2e/assets/index-*.js >/dev/null
          ls dist-e2e/assets/style-*.css >/dev/null
          grep -q '<div id="app"' dist-e2e/index.html
          # The workspace really was baked in, not left to be fetched.
          grep -q 'Big Bank plc' dist-e2e/assets/index-*.js

      - name: Render Big Bank plc (--single-file)
        run: pnpm render "$BIG_BANK" --single-file --out dist-single

      - name: Assert the single-file output is one document
        run: |
          test -f dist-single/index.html
          test -f dist-single/artifact.html
          # Nothing else: no assets directory to go with it.
          test ! -d dist-single/assets
          # A real page, not a stub. The Big Bank render is ~1 MB.
          test "$(wc -c < dist-single/index.html)" -gt 500000
          # artifact.html is the same page without its own document
          # scaffolding — that is the whole reason it is a second file.
          grep -q 'Big Bank plc' dist-single/index.html
          grep -q '<html' dist-single/index.html
          if grep -q '<html' dist-single/artifact.html; then
            echo "artifact.html must not carry its own <html> element" >&2
            exit 1
          fi

      # The core promise: opened over file://, from an email attachment or
      # inside a sandboxed frame, the single-file build makes no network
      # requests. Asset-bearing tags only — ordinary <a href="https://..."> in
      # the rendered documentation is content, not a request, and a blanket
      # `grep https://` would fail forever on it.
      - name: Assert no external asset references
        run: |
          cat > "${RUNNER_TEMP}/no-external-assets.mjs" <<'CHECK'
          import { readFileSync } from "node:fs";

          // Every way an HTML document can make the browser fetch something,
          // matched only when the target is absolute (https:, http:, or
          // protocol-relative //host). data: and relative URLs are fine.
          const PATTERNS = [
            ["script/img/media src", /<(?:script|img|iframe|embed|audio|video|track|source|input)\b[^>]*\bsrc\s*=\s*["']?(?:https?:)?\/\//gi],
            ["srcset", /<(?:img|source)\b[^>]*\bsrcset\s*=\s*["'][^"']*(?:https?:)?\/\/[^"']/gi],
            ["link href", /<link\b[^>]*\bhref\s*=\s*["']?(?:https?:)?\/\//gi],
            ["object data", /<object\b[^>]*\bdata\s*=\s*["']?(?:https?:)?\/\//gi],
            ["svg use href", /<use\b[^>]*\b(?:xlink:)?href\s*=\s*["']?(?:https?:)?\/\//gi],
            ["css @import", /@import\s+(?:url\(\s*)?["']?(?:https?:)?\/\//gi],
            ["css url()", /url\(\s*["']?(?:https?:)?\/\//gi],
          ];

          let failures = 0;
          for (const file of process.argv.slice(2)) {
            const html = readFileSync(file, "utf8");
            for (const [label, pattern] of PATTERNS) {
              for (const match of html.matchAll(pattern)) {
                failures += 1;
                const from = Math.max(0, match.index - 60);
                const context = html.slice(from, match.index + 120).replace(/\s+/g, " ");
                console.error(`${file}: external ${label}: ...${context}...`);
              }
            }
            console.log(`${file}: scanned ${html.length} bytes`);
          }

          if (failures > 0) {
            console.error(`FAIL: ${failures} external asset reference(s) in the single-file build`);
            process.exit(1);
          }
          console.log("OK: no external asset references");
          CHECK
          node "${RUNNER_TEMP}/no-external-assets.mjs" \
            dist-single/index.html \
            dist-single/artifact.html

      # Spec 15: every view of the acceptance set drawn by the React Flow
      # engine in headless Chrome (preinstalled on ubuntu-latest) and checked
      # through its geometry report, including the 2 s time to data-ready.
      - name: Acceptance harness (React Flow engine)
        run: node --test test/acceptance.test.js

      - name: Upload the rendered example
        if: matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: big-bank-plc-single-file
          path: dist-single/index.html
          retention-days: 7
          if-no-files-found: error

  # Structurizr's own tools against what this repository commits (spec 19.3).
  # The acceptance fixture keeps its layout in its committed workspace.json,
  # and `pnpm fixtures:acceptance` merges the DSL into it; this job runs that
  # with the pinned 2026 distribution and fails when the committed fixture is
  # out of date. Renovate bumps STRUCTURIZR_VERSION through the comment above
  # it (renovate.json, customManagers).
  structurizr:
    name: structurizr
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=structurizr/structurizr
      STRUCTURIZR_VERSION: "2026.09.19"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The WAR needs Java 21. Groovy, bundled in it, fails some `!script`
      # blocks on Java 26, so the job stays on the version Structurizr names.
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache structurizr.war
        id: war-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/structurizr
          key: structurizr-war-${{ env.STRUCTURIZR_VERSION }}

      - name: Download structurizr.war
        if: steps.war-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/structurizr"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/structurizr/structurizr.war" \
            "https://download.structurizr.com/structurizr-${STRUCTURIZR_VERSION}.war"

      - name: Point STRUCTURIZR_CLI at it
        run: |
          echo "STRUCTURIZR_CLI=java -jar ${RUNNER_TEMP}/structurizr/structurizr.war" >> "$GITHUB_ENV"

      - name: Regenerate the acceptance fixture
        run: pnpm fixtures:acceptance

      - name: Check the committed acceptance fixture is up to date
        run: |
          if git diff --exit-code -- test/__fixtures__/acceptance; then
            exit 0
          fi
          echo "::error title=Acceptance fixture out of date::pnpm fixtures:acceptance changed test/__fixtures__/acceptance. Run it with Structurizr ${STRUCTURIZR_VERSION} (STRUCTURIZR_CLI=\"java -jar structurizr.war\") and commit the result."
          exit 1

  # Every acceptance view in one HTML page, for a person reviewing a change to
  # the engine to file an issue against any view that reads worse (ADR 11).
  # Only on pull requests that touch `src/engine/` or `src/model/` (spec 16).
  # A review aid: `ci` does not need it, so it can never block a merge, and
  # nothing in it compares pixels.
  contact_sheet:
    name: contact sheet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the base branch is there to diff against.
          fetch-depth: 0
          persist-credentials: false

      # `.gitmodules` sets `update = none` so `npx` skips the submodule, which
      # makes `submodules: true` skip it as well. `--checkout` overrides that.
      - name: Check out the structurizr submodule
        run: git submodule update --init --checkout --depth=1 submodules/structurizr

      - name: Check whether the pull request touches the engine
        id: engine
        run: |
          if git diff --quiet "origin/${GITHUB_BASE_REF}...HEAD" -- src/engine src/model; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
          else
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.engine.outputs.touched == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        if: steps.engine.outputs.touched == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.engine.outputs.touched == 'true'
        run: pnpm install --frozen-lockfile

      - name: Screenshot every acceptance view
        if: steps.engine.outputs.touched == 'true'
        run: node test/contact-sheet.js contact-sheet

      - name: Upload the contact sheet
        if: steps.engine.outputs.touched == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contact-sheet
          path: contact-sheet/index.html
          retention-days: 14
          if-no-files-found: error

  # The `engines.node: ">=20"` floor, proved the way a user meets it.
  #
  # Deliberately uses npm and not pnpm, and installs production dependencies
  # only: that is what `npx github:FormulaMonks/renderizr` does. No lockfile, no
  # dev toolchain, no Biome, no TypeScript — just the runtime dependencies and
  # `node scripts/build.js`, which is the `renderizr` bin.
  #
  # The fixture is the committed one rather than the submodule's Big Bank, so
  # this job needs neither a submodule checkout nor the network — the same two
  # things a user on a locked-down machine will not have either.
  consumer:
    name: consumer (node 20, npm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install runtime dependencies only, with npm
        run: npm install --omit=dev --no-audit --no-fund

      - name: Render the fixture workspace
        run: node scripts/build.js scripts/__fixtures__/workspace.json --out dist-consumer

      - name: Assert it produced a site
        run: |
          test -f dist-consumer/index.html
          test -d dist-consumer/assets
          grep -q '<div id="app"' dist-consumer/index.html
          grep -q 'Fixture Workspace' dist-consumer/assets/index-*.js

      - name: Render it as a single file
        run: node scripts/build.js scripts/__fixtures__/workspace.json --single-file --out dist-consumer-single

      - name: Assert the single file reaches for nothing
        run: |
          test -f dist-consumer-single/index.html
          test ! -d dist-consumer-single/assets
          # Asset-bearing tags only. Ordinary content hyperlinks to
          # structurizr.com and c4model.com are expected and are not a leak.
          if grep -ohE '<(script|link|img|source|iframe|video|audio)[^>]*(src|href|srcset|poster)="https?://[^"]*"' \
               dist-consumer-single/index.html; then
            echo "::error title=Single-file output is not self-contained::The tags above reference a remote asset. --single-file must inline everything." >&2
            exit 1
          fi

  # One check to require in branch protection. A matrix leg that is skipped or
  # canceled is not a pass, so test the result explicitly rather than relying
  # on `needs` alone.
  ci:
    name: ci
    if: always()
    runs-on: ubuntu-latest
    needs: [pr_title, static, test, e2e, consumer, structurizr]
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.test.result }} ${{ needs.e2e.result }} ${{ needs.consumer.result }} ${{ needs.structurizr.result }}
          # `pr_title` is the one job that legitimately does not run on a push
          # to main — there is no pull request to read a title from. That is
          # the only case in which a non-success is accepted, and it is matched
          # exactly rather than by treating "skipped" as a pass everywhere.
          PR_TITLE_RESULT: ${{ needs.pr_title.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "static/test/e2e/consumer/structurizr: $RESULTS"
          echo "pr title: $PR_TITLE_RESULT (event: $EVENT)"
          failed=0
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          case "${EVENT}:${PR_TITLE_RESULT}" in
            pull_request:success) ;;
            push:skipped) ;;
            *) failed=1 ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
