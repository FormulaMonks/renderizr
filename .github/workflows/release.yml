# Releases are prepared by release-please and cut by merging the pull request it
# maintains. One source of truth — the conventional-commit messages on `main` —
# produces the version in package.json, the CHANGELOG.md entry, the git tag and
# the GitHub Release, so none of the four can drift from the others.
#
#   push to main        release-please recomputes the pending version from the
#                       commits since the last tag and opens (or updates) a
#                       "chore(release): X.Y.Z" pull request.
#   merge that PR       release-please tags vX.Y.Z, publishes the GitHub Release
#                       with the generated notes, and this workflow attaches the
#                       build artifacts to it.
#   workflow_dispatch   attach the build artifacts to a tag and Release that
#                       already exist. For a release cut by hand — the first
#                       one, or any made before the App was configured — which
#                       would otherwise carry no downloads at all.
#
# Renderizr is not published to any registry. It is consumed straight from git
# with `npx github:FormulaMonks/renderizr`, so the GitHub Release is the whole
# distribution channel and `package.json` is marked private to keep it that way.
#
# release-please runs as a GitHub App rather than as GitHub Actions. That is
# not a preference — see the comment on the first step; with GITHUB_TOKEN this
# workflow cannot open the release pull request at all, and if it could, `ci`
# would never run on it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach build artifacts to this existing release tag, e.g. v1.0.0"
        required: true
        type: string

# Least privilege by default: each job asks for what it needs and no more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Keeps the release pull request in sync with `main`, and — when that pull
  # request is merged — creates the tag and the GitHub Release.
  release-please:
    # Skipped, not failed, until the GitHub App is installed — see the
    # `release-app-missing` job below and MAINTAINERS.md. A brand-new clone of
    # this repository should not show a red release run for a setting nobody
    # has had the chance to configure yet.
    if: github.event_name == 'push' && vars.RELEASE_APP_ID != ''
    name: prepare release
    runs-on: ubuntu-latest
    permissions:
      # Deliberately read-only. Every write below is made with the App token
      # minted in the first step, not with GITHUB_TOKEN.
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please must not act as GitHub Actions itself, for two reasons.
      #
      # It cannot: "Allow GitHub Actions to create and approve pull requests"
      # is off for this repository, so opening the release pull request with
      # GITHUB_TOKEN fails with "GitHub Actions is not permitted to create or
      # approve pull requests".
      #
      # And it should not: a pull request opened with GITHUB_TOKEN does not
      # trigger other workflows, so `ci` would never report on the release pull
      # request — and `ci` is a required status check in the `main` ruleset.
      # Every release would need an administrator to bypass the ruleset.
      #
      # An App identity solves both. The pull request is not "GitHub Actions",
      # so the restriction does not apply, and it triggers ci.yml like any
      # other pull request.
      - name: Mint a token for the release pull request
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Says why nothing was released, rather than leaving a silently skipped job.
  # Green on purpose: not having configured the App yet is a to-do, not a
  # broken build.
  release-app-missing:
    if: github.event_name == 'push' && vars.RELEASE_APP_ID == ''
    name: prepare release (not configured)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::warning title=Releases are not configured::No RELEASE_APP_ID variable is set, so release-please did not run and no release pull request was opened or updated. Install the release GitHub App and add the RELEASE_APP_ID variable and RELEASE_APP_PRIVATE_KEY secret — see MAINTAINERS.md, 'Repository setup still to be done'."

  # Attaches something downloadable to the Release: a source tarball of exactly
  # the files a consumer receives, and a rendered example of what Renderizr
  # actually produces, in both of the shapes it produces — a static site, and
  # one self-contained file.
  #
  # `npm pack` builds the tarball because it already honors the `files` array;
  # it works on a private package and publishes nothing.
  release-assets:
    needs: release-please
    # Two ways in. Normally release-please has just created the Release and
    # this fills it. But a tag cut by hand — the first one, or any release made
    # before the App exists — produces a Release with nothing attached and no
    # way to fix it, so `workflow_dispatch` can point this job at an existing
    # tag instead. `always()` is required because release-please is skipped on
    # a dispatch, and a skipped dependency would otherwise skip this too.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    name: attach build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the Release
    env:
      # On a dispatch `inputs.tag` is set and release-please did not run; on a
      # push it is empty and the tag comes from release-please.
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the tag before building anything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag. Expected vMAJOR.MINOR.PATCH, e.g. v1.0.0."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist. Create and push it first."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No GitHub Release for $TAG. This job attaches assets to a Release; it does not create one."
            exit 1
          fi
          # `npm pack` and the artifact names use the bare version.
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The build does not need submodules/structurizr — the renderer is
          # vendored under vendor/. Left off on purpose.
          submodules: false
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11 # matches .mise.toml ("npm:pnpm" = "11")

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc && node scripts/build.js`, so the typecheck runs
      # here too. The example workspace is the fixture the test suite already
      # renders, which keeps this job offline.
      - name: Render the example site
        run: pnpm build scripts/__fixtures__/workspace.json --out example-site

      - name: Render the single-file example
        run: pnpm build scripts/__fixtures__/workspace.json --single-file --out example-single

      # The single-file promise is "no network requests". Assert it on the
      # artifact that is about to be attached, matching asset-bearing tags
      # specifically: ordinary hyperlinks in the rendered documentation are
      # content, not a dependency, and a blanket search for "https://" would
      # fail on them forever.
      - name: Assert the single-file output loads nothing over the network
        run: |
          set -euo pipefail
          pattern='<(script|link|img|source|iframe|embed|video|audio|track|object)[^>]+(src|href|srcset|data)[[:space:]]*=[[:space:]]*["'"'"']?(https?:)?//'
          for file in example-single/index.html example-single/artifact.html; do
            if grep -Eoi "$pattern" "$file"; then
              echo "::error file=$file::$file references an external asset; --single-file must inline everything"
              exit 1
            fi
            echo "ok: $file has no external asset references"
          done

      - name: Pack the npm tarball
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          cp example-single/index.html "artifacts/renderizr-example-${VERSION}.html"
          cp example-single/artifact.html "artifacts/renderizr-example-artifact-${VERSION}.html"
          (cd example-site && zip -qr "../artifacts/renderizr-example-site-${VERSION}.zip" .)
          (cd artifacts && sha256sum ./* > SHA256SUMS.txt)
          ls -l artifacts

      - name: Upload the artifacts to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
