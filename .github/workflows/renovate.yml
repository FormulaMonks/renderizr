# Renovate, self-hosted.
#
# Renovate runs here rather than through the hosted Mend app at
# github.com/apps/renovate, so the Renovate version is pinned in this file
# rather than being whatever the hosted service ships today, and so it runs
# with a token we hold.
#
# The token is a fine-grained personal access token stored as the repository
# secret RENOVATE_TOKEN, scoped to this repository, with Contents, Pull
# requests, Issues, Commit statuses and Workflows set to read and write. See
# MAINTAINERS.md, "Repository setup still to be done", for the full list and
# why each permission is there. It cannot be GITHUB_TOKEN: a pull request or
# push made with GITHUB_TOKEN does not trigger workflows, so `ci` would never
# report on Renovate's branches and nothing would ever be green enough to
# merge.
#
# Renovate merges its own pull requests (`platformAutomerge` is false in
# renovate.json): on each run it merges every branch that a rule marks
# `automerge` and whose checks are all green. So an update opened on Monday
# merges on the first run after its `ci` check passes.
#
# The cron below is how often Renovate *looks*; `renovate.json` decides what it
# is allowed to do when it looks. Most updates are gated to Monday mornings by
# the `schedule` there, and vulnerability alerts deliberately ignore that gate,
# which is why this runs daily rather than weekly.
name: renovate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options: [info, debug]
      dryRun:
        description: "Report what would happen without opening or merging anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never two Renovate runs at once: they would fight over the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A secret cannot appear in a job's `if`, so it goes through the
    # environment and each step checks it there.
    env:
      HAS_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' }}
    steps:
      # Say why nothing happened instead of leaving a green run that did
      # nothing, matching release.yml.
      - name: Report the missing token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Renovate is not configured::No RENOVATE_TOKEN secret is set, so Renovate did not run and no dependency pull requests were opened. Add a fine-grained personal access token with the permissions MAINTAINERS.md lists as the repository secret RENOVATE_TOKEN; see MAINTAINERS.md, 'Repository setup still to be done'."

      - name: Renovate
        if: env.HAS_TOKEN == 'true'
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # The action passes only RENOVATE_* and LOG_LEVEL into the
          # container by default; the log file needs these two as well.
          additional-env-list: |
            LOG_FILE
            LOG_FILE_LEVEL
        env:
          # A JSON log of the run, for the step below. The action mounts the
          # runner's /tmp into the container, so the file lands here too.
          LOG_FILE: /tmp/renovate-log.ndjson
          LOG_FILE_LEVEL: info
          # Self-hosted Renovate has no default target repository. Only this
          # one: the token may reach others, and this workflow is not a
          # license to touch them.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # renovate.json is committed, so there is nothing to onboard and no
          # onboarding pull request should ever be opened.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

      # Renovate exits 0 even when it gives up on the repository partway
      # through. A token without the Commit statuses permission made it stop
      # at the first branch, with "repository-changed", on every run for two
      # weeks, and each of those runs was green. So the run reads Renovate's
      # own verdict and fails unless it is "done".
      - name: Check that Renovate finished the repository
        if: env.HAS_TOKEN == 'true'
        run: |
          log=/tmp/renovate-log.ndjson
          if [ ! -s "$log" ]; then
            echo "::error title=Renovate wrote no log::$log is missing or empty, so there is no way to tell whether Renovate finished the repository."
            exit 1
          fi
          result=$(jq -r 'select(.msg == "Repository finished") | .result' "$log" | tail -n 1)
          echo "Renovate's result: ${result:-none}"
          if [ "$result" != "done" ]; then
            echo "::error title=Renovate did not finish the repository::Renovate stopped with result '${result:-none}', so it opened, updated or merged only part of what it should have. Rerun this workflow with logLevel set to debug and look for the request that failed; a 403 means RENOVATE_TOKEN lacks a permission that MAINTAINERS.md lists."
            exit 1
          fi
