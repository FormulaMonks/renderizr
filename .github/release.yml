# Configuration for GitHub's "generate release notes" button and API.
#
# release-please writes the notes for a normal release from the conventional-commit
# messages themselves, so this file is the fallback path: notes generated by hand
# from the Releases UI, or by `gh release create --generate-notes`. GitHub groups
# those by pull request *label*, not by commit type, which is why the categories
# below list the labels a pull request carries for each conventional-commit type.
#
# Keep the category titles in step with the `changelog-sections` in
# release-please-config.json, so a hand-generated set of notes reads like a
# generated one.
changelog:
  exclude:
    labels:
      # release-please's own bookkeeping pull request.
      - "autorelease: pending"
      - "autorelease: tagged"
      # Escape hatch for anything a maintainer decides is not worth a line.
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking
        - "semver: major"

    - title: Added
      labels:
        - feat
        - feature
        - enhancement

    - title: Fixed
      labels:
        - fix
        - bug

    - title: Changed
      labels:
        - perf
        - refactor

    - title: Removed
      labels:
        - revert
        - removal

    - title: Security
      labels:
        - security

    - title: Documentation
      labels:
        - docs
        - documentation

    - title: Dependencies
      labels:
        - deps
        - dependencies

    # Catch-all, so a pull request that nobody labeled is still listed rather
    # than silently dropped from the notes.
    - title: Other changes
      labels:
        - "*"
